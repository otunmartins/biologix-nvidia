# Alembic owns the schema for every database that is not the local SQLite
# file. The URL deliberately does NOT live here: migrations/env.py reads
# BIOLOGIX_DATABASE_URL through biologix.settings, so there is exactly one
# place a connection string is configured and a credential is never committed.
[alembic]
script_location = migrations
prepend_sys_path = backend
path_separator = os

# Revision filenames sort chronologically, which makes the history readable
# as a history rather than as a pile of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No post-write hooks: ruff ships as a standalone binary with no
# console_scripts entry point, so Alembic cannot invoke it that way and the
# hook fails on every revision. Run `ruff format migrations/` by hand if a
# generated file needs tidying.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
